<title>Szelekovszky Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">

<style>
/* Layout: one narrow column, one typeface, two weights.
   All content lives in works.js — this file is the frame only. */
:root{
  --paper:#f0f0ef;
  --ink:#16181a;
  --muted:#6b7173;
  --rule:#d8dad9;
  --panel:#e7e9e8;
  --accent:#2f3f8f;
  --sans:"Instrument Sans",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121314; --ink:#e9eae9; --muted:#9aa0a1; --rule:#292c2d;
    --panel:#1b1d1e; --accent:#93a6ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121314; --ink:#e9eae9; --muted:#9aa0a1; --rule:#292c2d;
  --panel:#1b1d1e; --accent:#93a6ff; color-scheme:dark;
}

body{background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.5;letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(56px,13vh,120px);
  display:flex;flex-direction:column;gap:clamp(48px,9vw,76px);}
p{margin:0;}
a{color:inherit;}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px;}

.head{display:flex;flex-direction:column;gap:16px;}
.name{font-weight:500;}
.intro{color:var(--muted);max-width:48ch;}

.works{display:flex;flex-direction:column;gap:clamp(44px,8vw,68px);}
.work{display:flex;flex-direction:column;gap:10px;min-width:0;}
.plates{display:grid;grid-template-columns:1fr;gap:8px;}
.plates.pair{grid-template-columns:1fr 1fr;}
.plate{background:var(--panel);max-width:100%;display:grid;place-items:center;overflow:hidden;min-width:0;}
.plate span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.plate img{display:block;width:100%;height:100%;object-fit:cover;}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:8px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-4px;}
.work h2{margin:0;font-size:15px;font-weight:500;letter-spacing:-0.005em;}
.work h2 .yr{font-weight:400;color:var(--muted);}
.meta{color:var(--muted);}
.line{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.buy{text-decoration:none;color:var(--accent);border-bottom:1px solid var(--accent);padding-bottom:1px;}
.buy:hover{opacity:.6;}
.work.sold .line{color:var(--muted);}

.foot{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--rule);padding-top:26px;
  color:var(--muted);}
.mail{color:var(--ink);user-select:all;}
.copy{font-family:inherit;font-size:12px;background:none;border:1px solid var(--rule);
  color:var(--muted);padding:5px 11px;cursor:pointer;}
.copy:hover{border-color:var(--accent);color:var(--accent);}
.mailrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div class="wrap">

  <header class="head">
    <p class="name" id="name"></p>
    <p class="intro" id="intro"></p>
  </header>

  <main class="works" id="works"></main>

  <footer class="foot">
    <p id="terms"></p>
    <div class="mailrow">
      <span class="mail" id="mail"></span>
      <button class="copy" id="copy" type="button">Copy</button>
    </div>
    <p><a id="ig" href="#"></a></p>
  </footer>

</div>

<script src="works.js"></script>
<script>
(function(){
  var esc = function(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; };

  document.getElementById('name').textContent  = STUDIO.name;
  document.getElementById('intro').textContent = STUDIO.intro;
  document.getElementById('terms').textContent = STUDIO.terms;
  document.getElementById('mail').textContent  = STUDIO.email;
  var ig = document.getElementById('ig');
  ig.textContent = '@' + STUDIO.instagram;
  ig.href = 'https://instagram.com/' + STUDIO.instagram;

  document.getElementById('works').innerHTML = WORKS.map(function(w){
    var ratio = w.ratio || '4/5';
    function plate(src, label){
      return '<div class="plate" style="aspect-ratio:' + esc(ratio) + '">'
        + (src ? '<img src="' + esc(src) + '" alt="' + esc(w.title) + ' — ' + label + '">'
               : '<span>' + esc(label) + '</span>')
        + '</div>';
    }
    var plates = w.verso
      ? '<div class="plates pair">' + plate(w.image,'Recto') + plate(w.verso,'Verso') + '</div>'
        + '<div class="caps"><span>Recto</span><span>Verso</span></div>'
      : '<div class="plates">' + plate(w.image,'Image — ' + ratio) + '</div>';
    var line = w.sold
      ? 'Sold'
      : esc(w.price) + (w.buy ? ' <a class="buy" href="' + esc(w.buy) + '">Acquire</a>' : '');
    return '<article class="work' + (w.sold ? ' sold' : '') + '">'
      + plates
      + '<h2>' + esc(w.title) + ' <span class="yr">' + esc(w.year) + '</span></h2>'
      + '<p class="meta">' + esc(w.medium) + ' · ' + esc(w.size) + '</p>'
      + '<p class="line">' + line + '</p>'
      + '</article>';
  }).join('');

  var btn=document.getElementById('copy'), mail=document.getElementById('mail');
  function select(){
    var r=document.createRange(); r.selectNodeContents(mail);
    var s=getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent='Select and copy';
  }
  btn.addEventListener('click',function(){
    try{
      navigator.clipboard.writeText(mail.textContent.trim()).then(function(){
        btn.textContent='Copied'; setTimeout(function(){btn.textContent='Copy';},1600);
      },select);
    }catch(e){select();}
  });
})();
</script>
