<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szelekovszky Studio</title>
<meta name="description" content="Paintings and works on paper by András Szelekovszky, sold directly from the studio in Zürich.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">

<style>
/* Layout: phone — one column, images as a swipe slider (front, then back).
   Desktop — a fixed left column with the studio details, works to the right,
   each work showing front and back side by side. All content lives in works.js. */
*{box-sizing:border-box;}
html,body{margin:0;}
img{max-width:100%;}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f0f0ef;
  --ink:#16181a;
  --muted:#6b7173;
  --rule:#d8dad9;
  --panel:#e7e9e8;
  --accent:#2f3f8f;
  --sans:"Instrument Sans",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121314; --ink:#e9eae9; --muted:#9aa0a1; --rule:#292c2d;
    --panel:#1b1d1e; --accent:#93a6ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121314; --ink:#e9eae9; --muted:#9aa0a1; --rule:#292c2d;
  --panel:#1b1d1e; --accent:#93a6ff; color-scheme:dark;
}

body{background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.5;letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(56px,13vh,120px);
  display:flex;flex-direction:column;gap:clamp(48px,9vw,76px);}
p{margin:0;}
a{color:inherit;}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px;}

.head{display:flex;flex-direction:column;gap:16px;}
.name{font-weight:500;}
.intro{color:var(--muted);max-width:48ch;}

.works{display:flex;flex-direction:column;gap:clamp(44px,8vw,68px);}
.work{display:flex;flex-direction:column;gap:10px;min-width:0;}

/* phone: horizontal snap slider */
.plates{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;}
.plates::-webkit-scrollbar{display:none;}
.plate{flex:0 0 100%;scroll-snap-align:start;background:var(--panel);
  display:grid;place-items:center;overflow:hidden;min-width:0;}
.plate span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.plate img{display:block;width:100%;height:100%;object-fit:cover;}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-2px;}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block;}
.dots i.on{background:var(--muted);}

.meta{color:var(--muted);}
.work h2{margin:0;font-size:15px;font-weight:500;letter-spacing:-0.005em;}
.work h2 .yr{font-weight:400;color:var(--muted);}
.line{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.buy{text-decoration:none;color:var(--accent);border:1px solid var(--accent);
  padding:6px 13px;font-size:13px;}
.buy:hover{background:var(--accent);color:var(--paper);}
.work.sold .line{color:var(--muted);}

.foot{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--rule);padding-top:26px;
  color:var(--muted);}

/* ── desktop ───────────────────────────────────────────────── */
@media (min-width:1024px) and (pointer:fine){
  body{font-size:16px;}
  .wrap{max-width:1180px;
    display:grid;grid-template-columns:300px minmax(0,1fr);
    column-gap:72px;row-gap:0;align-items:start;
    padding-block:96px;}
  .head{grid-column:1;position:sticky;top:96px;gap:20px;}
  .works{grid-column:2;grid-row:1 / span 2;gap:88px;}
  .foot{grid-column:1;position:sticky;top:300px;margin-top:32px;border-top:1px solid var(--rule);}

  /* both images visible, no swiping */
  .plates{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:visible;}
  .plate{flex:none;}
  .dots{display:none;}
  .work{gap:12px;}
}
@media (min-width:1280px){
  .wrap{column-gap:96px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <p class="name" id="name"></p>
    <p class="intro" id="intro"></p>
  </header>

  <main class="works" id="works"></main>

  <footer class="foot">
    <p id="terms"></p>
    <p><a id="ig" href="#"></a></p>
  </footer>

</div>

<script src="works.js"></script>
<script>
(function(){
  var esc = function(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; };

  document.getElementById('name').textContent  = STUDIO.name;
  document.getElementById('intro').textContent = STUDIO.intro;
  document.getElementById('terms').textContent = STUDIO.terms;
  var ig = document.getElementById('ig');
  ig.textContent = '@' + STUDIO.instagram;
  ig.href = 'https://instagram.com/' + STUDIO.instagram;

  document.getElementById('works').innerHTML = WORKS.map(function(w){
    var ratio = w.ratio || '4/5';
    function plate(src, label){
      return '<div class="plate" style="aspect-ratio:' + esc(ratio) + '">'
        + (src ? '<img src="' + esc(src) + '" alt="' + esc(w.title) + ' — ' + label + '" loading="lazy">'
               : '<span>' + esc(label) + '</span>')
        + '</div>';
    }
    var plates = w.verso
      ? '<div class="plates">' + plate(w.image,'Front') + plate(w.verso,'Back') + '</div>'
        + '<div class="dots"><i class="on"></i><i></i></div>'
      : '<div class="plates">' + plate(w.image,'Image — ' + ratio) + '</div>';

    var subject = encodeURIComponent('Enquiry — ' + w.title + ' (' + w.year + ')');
    var body = encodeURIComponent(
      'Hello András,\n\nI am interested in ' + w.title + ' (' + w.year + '), '
      + w.medium + ', ' + w.size + ', ' + w.price + '.\n\nCould you tell me about availability and shipping?\n\n');
    var line = w.sold
      ? 'Sold'
      : esc(w.price)
        + ' <a class="buy" href="mailto:' + esc(STUDIO.email) + '?subject=' + subject
        + '&body=' + body + '">Enquire</a>';

    return '<article class="work' + (w.sold ? ' sold' : '') + '">'
      + plates
      + '<h2>' + esc(w.title) + ' <span class="yr">' + esc(w.year) + '</span></h2>'
      + '<p class="meta">' + esc(w.medium) + ' · ' + esc(w.size) + '</p>'
      + '<p class="line">' + line + '</p>'
      + '</article>';
  }).join('');

  document.querySelectorAll('.work').forEach(function(a){
    var strip=a.querySelector('.plates'), dots=a.querySelector('.dots');
    if(!strip||!dots) return;
    strip.addEventListener('scroll',function(){
      var i = Math.round(strip.scrollLeft / strip.clientWidth);
      dots.querySelectorAll('i').forEach(function(d,n){ d.classList.toggle('on', n===i); });
    },{passive:true});
  });

})();
</script>
</body>
</html>
